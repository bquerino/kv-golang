# Docker Compose para modo LEADERLESS com Observabilidade e Testes Automáticos
# Para usar: docker-compose -f docker-compose-observability-leaderless.yml up --build

services:
  # KV Store nodes
  node1:
    build: .
    command: ["node1", "8081"]
    ports:
      - "8081:8081"
      - "9091:9091"  # Metrics
    networks:
      - kvnet
    environment:
      - MODE=leaderless
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  node2:
    build: .
    command: ["node2", "8082"]
    ports:
      - "8082:8082"
      - "9092:9092"  # Metrics
    networks:
      - kvnet
    environment:
      - MODE=leaderless
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  node3:
    build: .
    command: ["node3", "8083"]
    ports:
      - "8083:8083"
      - "9093:9093"  # Metrics
    networks:
      - kvnet
    environment:
      - MODE=leaderless
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    networks:
      - kvnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Observability stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - kvnet

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - kvnet

  # Alert manager
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9094:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - kvnet

  # K6 Load Testing - Executa automaticamente com delay para aguardar serviços
  k6-load-test:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
      - ./test-results:/results
    networks:
      - kvnet
    depends_on:
      nginx:
        condition: service_healthy
    command: >
      sh -c "sleep 30 && k6 run /scripts/load-test.js --out json=/results/load-test-results-leaderless.json"
    restart: "no"

  # K6 Failover Testing - Executa após load test
  k6-failover-test:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
      - ./test-results:/results
    networks:
      - kvnet
    depends_on:
      - k6-load-test
    command: >
      sh -c "sleep 10 && k6 run /scripts/failover-test.js --out json=/results/failover-test-results-leaderless.json"
    restart: "no"
    profiles:
      - extended-testing

  # K6 Consistency Testing - Específico para modo leaderless
  k6-consistency-test:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
      - ./test-results:/results
    networks:
      - kvnet
    depends_on:
      - k6-load-test
    command: >
      sh -c "sleep 15 && k6 run /scripts/consistency-test.js --out json=/results/consistency-test-results-leaderless.json"
    restart: "no"
    profiles:
      - consistency-testing

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  kvnet:
    driver: bridge
