# Docker Compose para modo LEADERLESS (explícito)
# Para usar: docker-compose -f docker-compose-leaderless.yml up --build -d

services:
  node1:
    build: .
    command: ["node1", "8081", "--mode", "leaderless"]
    ports:
      - "8081:8081"
    networks:
      - kvnet
    environment:
      - MODE=leaderless
    
  node2:
    build: .
    command: ["node2", "8082", "--mode", "leaderless"]
    ports:
      - "8082:8082"
    networks:
      - kvnet
    environment:
      - MODE=leaderless
      
  node3:
    build: .
    command: ["node3", "8083", "--mode", "leaderless"]
    ports:
      - "8083:8083"
    networks:
      - kvnet
    environment:
      - MODE=leaderless
      
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - kvnet

networks:
  kvnet:
    driver: bridge
