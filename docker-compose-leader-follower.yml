# Docker Compose para modo LEADER-FOLLOWER
# Para usar: docker-compose -f docker-compose-leader-follower.yml up --build -d

services:
  node1:
    build: .
    command: ["node1", "8081", "--mode", "leader-follower", "--election-timeout", "5000", "--heartbeat-interval", "1000"]
    ports:
      - "8081:8081"
    networks:
      - kvnet
    environment:
      - MODE=leader-follower
    
  node2:
    build: .
    command: ["node2", "8082", "--mode", "leader-follower", "--election-timeout", "6000", "--heartbeat-interval", "1000"]
    ports:
      - "8082:8082"
    networks:
      - kvnet
    environment:
      - MODE=leader-follower
      
  node3:
    build: .
    command: ["node3", "8083", "--mode", "leader-follower", "--election-timeout", "7000", "--heartbeat-interval", "1000"]
    ports:
      - "8083:8083"
    networks:
      - kvnet
    environment:
      - MODE=leader-follower
      
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - kvnet

networks:
  kvnet:
    driver: bridge
