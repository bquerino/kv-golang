version: '3.8'
services:
  node1:
    build: .
    command: ["node1", "8081"]
    ports:
      - "8081:8081"
    networks:
      - kvnet
  node2:
    build: .
    command: ["node2", "8082"]
    ports:
      - "8082:8082"
    networks:
      - kvnet
  node3:
    build: .
    command: ["node3", "8083"]
    ports:
      - "8083:8083"
    networks:
      - kvnet
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - kvnet

networks:
  kvnet:
    driver: bridge
