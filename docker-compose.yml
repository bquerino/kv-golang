version: "3.9"
services:
  node1:
    build: .
    command: ["--port", "8081", "--id", "node1"]
    ports:
      - "8081:8081"
  node2:
    build: .
    command: ["--port", "8082", "--id", "node2"]
    ports:
      - "8082:8082"
  node3:
    build: .
    command: ["--port", "8083", "--id", "node3"]
    ports:
      - "8083:8083"
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
      - node2
      - node3
