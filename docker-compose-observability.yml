services:
  # KV Store nodes
  node1:
    build: .
    command: ["./server", "node1", "8081", "--mode=leader-follower"]
    ports:
      - "8081:8081"
    environment:
      - METRICS_ENABLED=true
    networks:
      - kv-network
    depends_on:
      - prometheus

  node2:
    build: .
    command: ["./server", "node2", "8082", "--mode=leader-follower"]
    ports:
      - "8082:8082"
    environment:
      - METRICS_ENABLED=true
    networks:
      - kv-network
    depends_on:
      - prometheus

  node3:
    build: .
    command: ["./server", "node3", "8083", "--mode=leader-follower"]
    ports:
      - "8083:8083"
    environment:
      - METRICS_ENABLED=true
    networks:
      - kv-network
    depends_on:
      - prometheus

  # Load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - kv-network

  # Observability stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - kv-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kv-network

  # Alert manager
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9094:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - kv-network

  # K6 for load testing
  k6:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
    environment:
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
    networks:
      - kv-network
    profiles:
      - testing

volumes:
  prometheus_data:
  grafana_data:

networks:
  kv-network:
    driver: bridge
